<style>

.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--mu);animation:bn 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes bn{50%{transform:translateY(-5px)}}
.days{display:flex;gap:6px;margin-bottom:14px}.days button{flex:1;border:0;background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:8px 0;font-weight:700;font-size:11px;color:var(--mu)}.days b{display:block;font-size:17px;color:var(--ink);margin-top:2px}.days .on{background:var(--pr);border-color:var(--pr);color:var(--on)}.days .on b{color:var(--on)}.days .td:not(.on){border-color:var(--pr)}

.bars{display:flex;gap:10px;align-items:flex-end;height:90px}.bars div{flex:1;border-radius:10px 10px 4px 4px;background:var(--pr2);color:var(--pr);font-weight:800;font-size:11px;text-align:center;padding-top:4px;transition:height .8s}.bars div:last-child{background:var(--pr);color:var(--on)}
.doc{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:12px;margin-bottom:8px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--ln)}.kv:last-child{border:0}.kv span{color:var(--mu)}
textarea.ed,input.ed{width:100%;border:1.5px solid var(--pr);background:var(--bg);border-radius:12px;padding:10px;margin-top:6px;resize:vertical}
#toast{position:absolute;left:50%;bottom:92px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:30;max-width:88%;text-align:center}#toast.show{opacity:1;transform:translate(-50%,0)}
#sheet{position:absolute;inset:0;display:none;align-items:flex-end;background:#00000066;z-index:20}#sheet.show{display:flex}#sheet .p{background:var(--cd);width:100%;border-radius:28px 28px 0 0;padding:20px 20px 28px;animation:up .3s;max-height:85%;overflow:auto}@keyframes up{from{transform:translateY(100%)}}
.ctr{text-align:center}.ctr .av{margin:8px auto;animation:pl2 1.8s infinite}.x{animation:sh .4s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ni{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}

</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2e9a8d"/><stop offset="1" stop-color="#0f4f4c"/></linearGradient></defs></svg>
<div class="app" id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const I=(n,c='')=>`<span class="ms ${c}" aria-hidden="true">${n}</span>`;
const logo=(s=36,sp)=>`<svg class="logo ${sp?'spin':''}" viewBox="0 0 48 48" width="${s}" height="${s}" role="img" aria-label="Logo PalliativeLink"><rect width="48" height="48" rx="14" fill="url(#lg)"/><g fill="none" stroke="#fff" stroke-width="2.6"><circle cx="19" cy="24" r="10"/><circle cx="29" cy="24" r="10"/></g><path d="M24 15.34A10 10 0 0 1 24 32.66A10 10 0 0 1 24 15.34Z" fill="#ffc46b"/></svg>`;
const now=new Date(),T=(now.getDay()+6)%7,hh=()=>new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}).replace('.',':');

addr:'Jl. Gandaria No. 14, Kebayoran Baru, Jakarta Selatan',ther:'Terapi simptomatik paliatif nyeri & dukungan nutrisi enteral bertahap.',upd:'45 mnt lalu',
chat:[{w:'ai',t:'Halo Bu Dewi, saya melihat dari laporan siang ini bahwa Bpk. Sutrisno merasakan peningkatan nyeri di perut dan tidurnya sempat terganggu semalam. Bagaimana keadaannya sekarang? Apakah posisi tidurnya sudah terasa nyaman?',tm:'11:38'}]};

const em=n=>n<2?'sentiment_very_satisfied':n<4?'sentiment_satisfied':n<7?'sentiment_neutral':n<9?'sentiment_dissatisfied':'sentiment_very_dissatisfied';
const greet=()=>{const h=new Date().getHours();return h<11?'Pagi':h<15?'Siang':h<18?'Sore':'Malam'};

const line=(ser,lab)=>{const w=300,h=110,p=16,x=i=>p+i*(w-2*p)/6,y=(v,m)=>h-p-(v/m)*(h-2*p);
return `<svg viewBox="0 0 ${w} ${h+16}" width="100%" role="img" aria-label="Grafik tren 7 hari">${[0,.5,1].map(k=>`<line x1="${p}" x2="${w-p}" y1="${p+k*(h-2*p)}" y2="${p+k*(h-2*p)}" stroke="var(--ln)" stroke-dasharray="3 4"/>`).join('')}`+
ser.map(s=>`<polyline fill="none" stroke="${s.c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${s.a.map((v,i)=>x(i)+','+y(v,s.m)).join(' ')}"/>`+s.a.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v,s.m)}" r="${i==6?6:4}" fill="${i==6?s.c:'var(--cd)'}" stroke="${s.c}" stroke-width="2.5" data-a="pt" data-t="${lab[i]}: ${v}${s.u}" tabindex="0" style="cursor:pointer"/>`).join('')).join('')+
lab.map((l,i)=>`<text x="${x(i)}" y="${h+10}" font-size="9" text-anchor="middle" fill="var(--mu)">${l}</text>`).join('')+`</svg><p id="tip" class="mt" style="text-align:center;font-weight:700;margin:0;min-height:20px">Ketuk titik untuk melihat nilai</p>`};
const last7=()=>[...Array(7)].map((_,i)=>DN[(T+i-6+14)%7]).map((d,i)=>i==6?'Hari Ini':d);
const gauge=sc=>`<svg viewBox="0 0 200 120" class="gauge" role="img" aria-label="Skor ${sc} dari 100"><path class="trk" d="M12 104A88 88 0 0 1 188 104"/><path class="arc" d="M12 104A88 88 0 0 1 188 104" style="stroke-dasharray:276.5;stroke-dashoffset:276.5" data-o="${276.5*(1-sc/100)}"/><text x="100" y="92" class="gn">${sc}</text><text x="100" y="110" class="gl">/ 100</text></svg>`;

const nav=v=>`<nav>${[['home','home','Beranda'],['mon','monitor_heart','Monitoring'],['ai','neurology','Analisis AI'],['chat','forum','Konsultasi'],['cal','calendar_month','Kalender']].map(a=>`<button class="${v==a[0]?'on':''}" data-a="go" data-v="${a[0]}">${I(a[1])}${a[2]}</button>`).join('')}</nav>`;

<div class="card"><div class="row sp"><h3>${I('badge')} Identitas Dasar</h3><span class="pill">${I('verified','f')} Terverifikasi</span></div><div class="kv mt"><span>NIK</span><b>3174**********29</b></div><div class="kv"><span>Usia / Jenis kelamin</span><b>68 Tahun • Laki-laki</b></div><div class="kv"><span>Golongan Darah</span><b>${I('water_drop','f')} O Rh(+)</b></div><div class="mt"><small style="color:var(--mu)">${I('cottage')} Alamat Perawatan Rumah</small>${e?`<textarea class="ed" id="ad" rows="2">${esc(S.addr)}</textarea>`:`<br><b>${esc(S.addr)}</b>`}</div></div>
<div class="card"><h3>${I('clinical_notes')} Status Klinis & Paliatif</h3><p>Diagnosa Primer</p><b>Adenokarsinoma Kolon Stadium IV</b><div class="note">${I('info')}Metastasis hepar (terdokumentasi)</div><div class="row sp mt"><b>Palliative Performance Scale</b><span class="big tc" style="font-size:28px">60%</span></div><p>Sebagian besar waktu di tempat tidur atau kursi. Masih dapat berpindah mandiri ringan, namun memerlukan bantuan berkala untuk higienitas dan ambulasi.</p><div class="mt"><small style="color:var(--mu)">${I('medication')} Terapi Aktif</small>${e?`<textarea class="ed" id="th" rows="2">${esc(S.ther)}</textarea>`:`<br><b>${esc(S.ther)}</b>`}</div></div>
<div class="card"><div class="row sp"><h3>${I('diversity_3')} Jejaring Perawatan</h3><span class="pill">3 Aktor Siaga</span></div>${[['DS','Ibu Dewi Sartika','Caregiver utama • Anak kandung','chat','Ibu Dewi Sartika'],['SR','Puskesmas Kebayoran Baru','Ns. Siti Rahayu, S.Kep (tersambung)','call','Ns. Siti Rahayu'],['HN','RSUP Fatmawati','Dr. dr. Hendra, Sp.PD-KHOM','call','Dr. Hendra']].map(n=>`<div class="row mt"><div class="av">${n[0]}</div><div style="flex:1"><b>${n[1]}</b><br><small style="color:var(--mu)">${n[2]}</small></div><button class="ib" data-a="call" data-n="${n[4]}" aria-label="Hubungi">${I(n[3])}</button></div>`).join('')}</div>
<div class="card"><h3>${I('monitoring')} Baseline Fisiologis & Alat</h3><div class="g2 mt"><div class="note" style="display:block;margin:0">TD rata-rata<br><b style="font-size:20px">115/75</b> mmHg<br><span class="tc">Stabil</span></div><div class="note" style="display:block;margin:0">Berat badan<br><b style="font-size:20px">54</b> kg<br><span style="color:var(--cr)">▼ 2 kg bulan ini</span></div></div><div class="kv"><span>${I('air')} Oksigen konsentrator</span><b>2 L/mnt bila sesak</b></div><div class="kv"><span>${I('bed')} Kasur dekubitus</span><b>Aktif</b></div></div>
<div class="sec" style="margin-top:6px"><h2>${I('folder_shared')} Dokumen & Arsip</h2><a data-a="go" data-v="cal" data-t="1">Lihat Semua</a></div><button class="doc" data-a="toast" data-m="Membuka Resume Medis…">${I('description')}<span style="flex:1"><b>Resume Medis Terakhir</b><br><small style="color:var(--mu)">RSUP Fatmawati • PDF</small></span>${I('download')}</button></main>`};
V.esc=()=>{const sc=score(),s=stat(sc),L3=sc>70||S.l3;return `${back('Escalation',`<span class="pill ts ${s.t}">Protokol Aktif</span>`)}<main><div class="card al ${s.t}"><div class="row sp"><span class="pill ts">${I('notifications_active','f')} Tingkat ${s.n} (Skala ${S.pain})</span><small>25m lalu</small></div><h2 class="mt" style="margin-top:10px">Peringatan Dini: Deteriorasi Gejala Nyeri</h2><div class="note">${I('neurology')}<div><b>Sintesis AI PalliativeLink.</b> Intensitas nyeri naik dari skala 3 ke skala ${S.pain}, disertai penurunan durasi istirahat malam (&lt;4 jam), dipicu input rutin caregiver Ibu Dewi.</div></div><div class="chips"><span class="pill">${I('person')} Caregiver: Ibu Dewi</span><span class="pill">${I('medication')} Dosis terjadwal: terpenuhi</span></div></div>
<div class="sec" style="margin-top:6px"><div><h2>Alur Eskalasi Berlapis</h2><p style="margin:0">Triase terpadu keluarga & faskes</p></div><span class="pill ts t1">Level ${L3?3:2} Aktif</span></div>
<div class="lv d"><span class="nd">${I('check')}</span><details><summary><span>Level 1 — Mandiri <span class="pill">Selesai</span></span>${I('expand_more')}</summary><p>Parasetamol oral 500mg lini pertama sesuai panduan tim paliatif; posisi baring semi-Fowler 30°.</p><div class="note">${I('info')}Respons parsial, nyeri kembali meningkat setelah 2 jam.</div></details></div>
<div class="lv ${L3?'d':'a'}"><span class="nd">${I('medical_services')}</span><details open><summary><span>Level 2 — Konsultasi Nakes <span class="pill ts t1">${L3?'Selesai':'Berjalan'}</span></span>${I('expand_more')}</summary><p>Notifikasi terkirim ke dashboard Ns. Siti Rahayu. Data vital & catatan nyeri siap ditinjau.</p><div class="row"><div class="av">SR</div><div><b>Ns. Siti Rahayu, S.Kep</b><br><small style="color:var(--mu)">Perawat Koordinator Paliatif Komunitas</small></div></div><div class="note">${I('home_health')}Kunjungan rumah tersedia (SLA &lt; 4 jam)</div></details></div>
<div class="lv ${L3?'a':''}"><span class="nd">${I('local_hospital')}</span><details ${L3?'open':''}><summary><span>Level 3 — Rujukan Tersier <span class="pill ${L3?'ts t2':''}">${L3?'Disiapkan':'Siaga'}</span></span>${I('expand_more')}</summary><p>RSUP Fatmawati (Instalasi Paliatif & IGD). Disiapkan bila muncul red flag: sesak progresif, delirium akut, atau nyeri refrakter skala &gt;7.</p><div class="note">${I('sync')}Data SatuSehat & riwayat terapi siap disinkronkan</div>${L3?'':`<button class="btn o s mt" data-a="l3">${I('local_hospital')} Siapkan Rujukan Sekarang</button>`}</details></div>
<button class="btn" data-a="call" data-n="Ns. Siti Rahayu" style="padding:18px">${I('video_call')} Hubungi Nakes Puskesmas (Telekonsultasi)</button></main>`};
const TOP={home:1,mon:1,ai:1,chat:1,cal:1};let cur,tm,tt,iv;
function render(){const keep=cur==location.hash.slice(1)&&$('#m')?$('#m').scrollTop:0;let v=location.hash.slice(1);if(!V[v])v='login';cur=v;
$('#app').innerHTML=(TOP[v]?topbar(v):'')+(v=='prof'||v=='esc'?V[v]():`<main id="m" class="${v}">${V[v]()}</main>`)+(TOP[v]?nav(v):'')+'<div id="toast" role="status"></div><div id="sheet"></div>';
const m=$('#app main');if(m){m.id='m';m.scrollTop=keep}if(v=='chat'){const g=$('#msgs');g.scrollTop=g.scrollHeight}
setTimeout(()=>document.querySelectorAll('.arc').forEach(a=>a.style.strokeDashoffset=a.dataset.o),80)}
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2400)};
const sheet=h=>{const s=$('#sheet');s.innerHTML=`<div class="p" role="dialog">${h}</div>`;s.classList.add('show')};
const close=()=>{clearInterval(iv);$('#sheet').classList.remove('show')};
const go=v=>{location.hash=v;if(!location.hash||location.hash.slice(1)==cur)render();$('#m')&&($('#m').scrollTop=0)};
const A={go:t=>{if(t.dataset.t)S.calTab=1;go(t.dataset.v)},toast:t=>toast(t.dataset.m),role:t=>{S.role=+t.dataset.i;render();if(S.role)toast('Mode Nakes: tampilan demo memakai data pasien yang sama')},eye:t=>{const p=$('#pw');p.type=p.type=='password'?'text':'password'},
login:()=>{if(!$('#em').value.trim()||!$('#pw').value){$('#er').textContent='Email/No. RM dan kata sandi wajib diisi.';$('#er').classList.add('x');setTimeout(()=>$('#er').classList.remove('x'),500);return}go('home');setTimeout(()=>toast('Selamat datang, Ibu Dewi'),150)},
reg:()=>{S.edit=1;go('prof');setTimeout(()=>toast('Mode registrasi: lengkapi data pasien lalu simpan'),150)},
notif:()=>sheet(`<h2>Notifikasi</h2>${[['notification_important','Skor risiko naik ke Waspada','Nyeri meningkat dalam 12 jam terakhir','5 mnt lalu'],['medication','Morfin oral 12:00 WIB','Konfirmasi setelah diberikan','20 mnt lalu'],['home_health','Kunjungan Nakes besok','Ns. Siti Rahayu terkonfirmasi','1 jam lalu']].map(n=>`<div class="ni"><span class="q" style="padding:10px;border:0;background:var(--pr2);color:var(--pr)">${I(n[0])}</span><div><b>${n[1]}</b><p style="margin:0">${n[2]} • ${n[3]}</p></div></div>`).join('')}<button class="btn g mt" data-a="close">Tutup</button>`),
close,tip:()=>{S.tip++;render()},med:()=>{S.done[T+'-2']=!isD(T,2);render();toast(isD(T,2)?'Dosis morfin tercatat diberikan ✓':'Dosis dibatalkan')},
opt:t=>{S[t.dataset.k]=+t.dataset.v;render()},pc:t=>{S[t.dataset.k]=t.dataset.v;render()},
submit:()=>{const sc=score();S.upd='baru saja';toast(`Laporan terkirim. Skor risiko: ${sc} (${stat(sc).n})`);setTimeout(()=>go(sc>70?'esc':'ai'),900)},
pt:t=>{const p=$('#tip');if(p)p.textContent=t.dataset.t},chk:t=>{S.chk[t.dataset.i]=!S.chk[t.dataset.i];render()},
q:t=>{$('#ci')&&($('#ci').value=t.dataset.q);A.send()},ctab:t=>{S.calTab=+t.dataset.i;render()},day:t=>{S.day=+t.dataset.i;render()},
tk:t=>{const i=t.dataset.i;S.done[S.day+'-'+i]=!isD(S.day,i);render();toast(isD(S.day,i)?'Tindakan ditandai selesai':'Penanda dibatalkan')},
snz:t=>{const b=base[t.dataset.i][0],[h,m]=(S['sn'+t.dataset.i]||b).split(':').map(Number),n=h*60+m+15;S['sn'+t.dataset.i]=String(n/60|0).padStart(2,'0')+':'+String(n%60).padStart(2,'0');render();toast('Pengingat ditunda 15 menit')},
resch:()=>sheet(`<h2>Atur Ulang Kunjungan</h2><p>Pilih jam kunjungan Ns. Siti Rahayu besok:</p><div class="chips">${['09:30','11:00','13:30','15:00'].map(h=>`<button class="chip ${S.visit==h?'on':''}" data-a="vs" data-h="${h}">${h} WIB</button>`).join('')}</div><button class="btn g mt" data-a="close">Batal</button>`),
vs:t=>{S.visit=t.dataset.h;close();render();toast('Permintaan jadwal baru dikirim ke Puskesmas')},
edit:()=>{if(S.edit){S.addr=$('#ad').value||S.addr;S.ther=$('#th').value||S.ther;toast('Profil pasien tersimpan')}S.edit=!S.edit;const k=$('#app').scrollTop;render()},l3:()=>sheet(`<h2>Siapkan Rujukan?</h2><p>RSUP Fatmawati akan menerima ringkasan klinis via SatuSehat dan menyiapkan IGD/Instalasi Paliatif. Keputusan akhir tetap oleh tenaga medis.</p><button class="btn r mt" data-a="l3y">Ya, siapkan rujukan</button><button class="btn g mt" data-a="close">Batal</button>`),l3y:()=>{S.l3=1;close();render();toast('Rujukan Level 3 disiapkan')},
call:t=>{const n=t.dataset.n||'Ns. Siti Rahayu',ini=n.split(' ').map(w=>w[0]).slice(0,2).join('');sheet(`<div class="ctr"><div class="av l">${ini}</div><h2>${n}</h2><p id="cs">Menyambungkan…</p><button class="btn r mt" data-a="end">${I('call_end')} Akhiri</button></div>`);let s=0;clearInterval(iv);iv=setInterval(()=>{s++;const c=$('#cs');if(!c)return clearInterval(iv);if(s>=2)c.textContent='Tersambung • 00:'+String(s-2).padStart(2,'0')},1000)},end:()=>{close();toast('Panggilan selesai • catatan tersimpan di arsip')},
send:()=>{const i=$('#ci');if(!i||!i.value.trim())return;const x=i.value.trim();S.chat.push({w:'me',t:esc(x),tm:hh()});S.typing=1;draw();setTimeout(()=>{S.typing=0;S.chat.push(reply(x));draw()},1100)}};
function draw(){$('#cl').innerHTML=chatH();const g=$('#msgs');g.scrollTop=g.scrollHeight;$('#ci').value=''}
function reply(x){x=x.toLowerCase();const m=(t,b)=>({w:'ai',t,tm:hh(),b});
if(/sesak|napas/.test(x))return m('Atur posisi <b>semi-fowler 30–45°</b> dan beri oksigen 2 L/menit sesuai resep bila sesak. Jika sesak muncul saat istirahat atau memburuk cepat, itu <b>red flag</b> — segera hubungi Nakes.',['Hubungi Nakes','call']);
if(/mual|muntah/.test(x))return m('Beri makanan lunak porsi kecil tapi sering, hindari bau menyengat, dan tawarkan air hangat sedikit-sedikit. Bila muntah lebih dari 1 kali, kabari Nakes.');
if(/obat|morfin|jadwal/.test(x))return m('Dosis berikutnya: <b>Morfin oral 10mg pukul 12:00 WIB</b>, diberikan sesudah minum susu. Konfirmasi di Kalender setelah diberikan.',['Buka Kalender','cl2']);
if(/nyeri|sakit|kram/.test(x))return m(`Terima kasih, Bu. Nyeri tercatat <b>${S.pain}/10</b>. Coba kompres hangat di pinggang/perut samping, posisi semi-duduk dengan bantal di bawah lutut, dan musik instrumental yang tenang. Bila nyeri di atas 6 setelah obat, kami hubungkan ke Ners Siti Rahayu.`,['Hubungi Ns. Siti','call']);
if(/nakes|dokter|perawat|telepon|darurat/.test(x))return m('Baik, saya sambungkan Ibu ke Ners Siti Rahayu di Puskesmas Kebayoran Baru. Data gejala terbaru sudah siap ditinjau.',['Mulai Telekonsultasi','call']);
return m('Terima kasih sudah berbagi, Bu. Saya catat untuk tim paliatif. Ceritakan lebih detail: nyeri, napas, mual, atau tidur Bapak?')}
A.cl2=()=>go('cal');
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t){A[t.dataset.a]&&A[t.dataset.a](t,e);return}if(e.target.id=='sheet')close()});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='ci')A.send();if(e.key=='Enter'&&e.target.dataset.a=='pt')A.pt(e.target);if(e.key=='Escape')close()});
document.addEventListener('input',e=>{if(e.target.id=='pain'){S.pain=+e.target.value;$('#pv').firstChild.nodeValue=S.pain;$('#pl').innerHTML=I(em(S.pain))+' '+pl(S.pain)}});
addEventListener('hashchange',render);render();
</script></body></html>
